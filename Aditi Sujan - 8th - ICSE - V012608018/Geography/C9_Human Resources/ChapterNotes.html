<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlTheme = params.get('theme');
        const isDark = urlTheme === 'dark' || (!urlTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || localStorage.getItem('vardaan_theme') === 'dark';
        if (urlTheme === 'dark' || (urlTheme !== 'light' && isDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode', 'dark');
        } else if (urlTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-mode', 'dark');
        }
        if (urlTheme) localStorage.setItem('vardaan_theme', urlTheme);
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f6f7fb; color: #1f2937; }
    .container { max-width: 900px; margin: 32px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
    h1 { margin-bottom: 12px; }
    p { line-height: 1.6; margin-bottom: 12px; }
    .meta { color: #6b7280; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chapter Notes</h1>
    <p class="meta">Add chapter notes and key points here.</p>
    <p>This page is ready for your study content.</p>
  </div>
</body>
</html>
