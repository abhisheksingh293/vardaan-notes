<!doctype html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlTheme = params.get('theme');
        const isDark = urlTheme === 'dark' || (!urlTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || localStorage.getItem('vardaan_theme') === 'dark';
        if (urlTheme === 'dark' || (urlTheme !== 'light' && isDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode', 'dark');
        } else if (urlTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-mode', 'dark');
        }
        if (urlTheme) localStorage.setItem('vardaan_theme', urlTheme);
      } catch(e) {}
    })();
  </script>
  <meta charset="utf-8">
  <title>Chapter 1 - Plant Life</title>
</head>
<body>
  <h1>Chapter 1: Plant Life</h1>
  <h2>Topics</h2>
  <ul>
    <li>The Leaf: structure, functions</li>
    <li>The Flower: parts and role in reproduction</li>
  </ul>
  <p>Notes: Add classroom notes and images here.</p>
</body>
</html>
