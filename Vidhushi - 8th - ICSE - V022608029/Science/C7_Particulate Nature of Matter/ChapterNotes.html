<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlTheme = params.get('theme');
        const isDark = urlTheme === 'dark' || (!urlTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || localStorage.getItem('vardaan_theme') === 'dark';
        if (urlTheme === 'dark' || (urlTheme !== 'light' && isDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode', 'dark');
        } else if (urlTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-mode', 'dark');
        }
        if (urlTheme) localStorage.setItem('vardaan_theme', urlTheme);
      } catch(e) {}
    })();
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particulate Nature of Matter - Science</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f6f8fb;
            color: #1f2937;
        }
        .card {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Particulate Nature of Matter</h1>
        <p>Chapter notes placeholder.</p>
    </main>
</body>
</html>
