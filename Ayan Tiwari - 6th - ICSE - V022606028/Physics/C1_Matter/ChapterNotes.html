<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlTheme = params.get('theme');
        const isDark = urlTheme === 'dark' || (!urlTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || localStorage.getItem('vardaan_theme') === 'dark';
        if (urlTheme === 'dark' || (urlTheme !== 'light' && isDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode', 'dark');
        } else if (urlTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark-mode', 'dark');
        }
        if (urlTheme) localStorage.setItem('vardaan_theme', urlTheme);
      } catch(e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matter - Physics Notes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f5f7fb;
      color: #111827;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
    }
    h1 { margin-top: 0; color: #F97315; }
    p { line-height: 1.7; color: #374151; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Matter</h1>
    <p>This chapter page has been added to the Physics folder. Notes can be filled in next.</p>
  </div>
</body>
</html>
